apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
      - name: notification
        image: miheret217/notification-service:latest 
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
          - name: DATABASE_URL
            value: "postgresql://postgres.ekdjzirbeiakbqpcjhnb:RMfLaxJEkR9kgUYc@aws-1-eu-west-1.pooler.supabase.com:5432/postgres"
          
          # Application Settings
          - name: PORT
            value: "3000"
          - name: SERVICE_API_KEY
            value: "super-secret-notification-token"

          # Redis Message Broker Connection (The "Post Office" Link)
          # 'redis-service' matches the name in your redis.yaml
          - name: REDIS_URL
            value: "redis://redis-service:6379"
          - name: REDIS_HOST
            value: "redis-service"
          - name: REDIS_PORT
            value: "6379"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector:
    app: notification
  ports:
    - protocol: TCP
      port: 80         # Internal Cluster Port (Other pods call http://notification-service)
      targetPort: 3000 # The port the Node.js app is actually listening on
  type: ClusterIP
