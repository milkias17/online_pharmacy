apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medivo-gateway
  annotations:
    # This captures everything in the (.*) and passes it to the backend
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      # Pattern: /service-name/(.*) maps to $1
      - path: /auth/(.*)
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 80
      - path: /inventory/(.*)
        pathType: Prefix
        backend:
          service:
            name: inventory-service
            port:
              number: 80
      - path: /order/(.*)
        pathType: Prefix
        backend:
          service:
            name: order-service
            port:
              number: 80
      - path: /payment/(.*)
        pathType: Prefix
        backend:
          service:
            name: payment-service
            port:
              number: 80


